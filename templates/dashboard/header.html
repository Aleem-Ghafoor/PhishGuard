<header class="top-header">
  <div class="header-left">
    <!-- Hamburger Button for Mobile -->
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    
    <div>
      <h1>Dashboard</h1>
      <p>Monitor scans, analyze results, and keep your online activity safe.</p>
    </div>
  </div>
  
  <div class="header-right">
    <button class="icon-btn search-btn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="icon-btn notify-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="badge-dot"></span>
    </button>
    
    <div class="user-profile">
      <a href="{% url 'profile' %}" style="text-decoration: none; color: inherit;">
        <div class="avatar">
          {{ request.user.first_name|default:request.user.username|first|upper }}
        </div>
      </a>
        <div class="user-info">
          <span class="user-name">
            {{ request.user.first_name }} {{ request.user.last_name }}
          </span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chevron"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
    </div>
  </div>
</header>
